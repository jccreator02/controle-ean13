<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061225">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EAN13">
  <title>Contrôle EAN13</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <div id="installHint" class="install-hint hidden">
  📱 Pour l’installer : utilisez le menu du navigateur puis <strong>Ajouter à l’écran d’accueil</strong>.
  <button id="closeInstallHint" aria-label="Fermer">×</button>
</div>
<section class="card hero">
    <div class="title-row">
      <div class="icon barcode-icon">▥</div>
      <div>
        <h1>Contrôle EAN13 <span class="version-badge">V6.4</span></h1>
        <p>Charger un fichier TXT contenant les EAN13 de référence.</p>
      </div>
    </div>
    <label class="file-picker">
      <span class="info">i</span>
      <strong>Choisir un fichier</strong>
      <span id="fileName">Aucun fichier n’a été sélectionné</span>
      <input id="fileInput" type="file" accept=".txt,text/plain">
    </label>
    <div id="fileStatus" class="status"></div>
  </section>

  <section class="card scan-card">
    <h2><span class="camera">◉</span> Scan</h2>
    <div class="scanner">
      <video id="video" playsinline muted></video>
      <div class="scan-placeholder" id="scanPlaceholder">
        <div class="big-barcode">▥</div>
        <strong>Scanner EAN13</strong>
        <span>Autoriser l’accès à la caméra puis viser le code-barres.</span>
      </div>
      <div class="corners"></div>
    </div>
    <div class="scan-actions">
      <button id="startCamera" class="secondary">📷 Démarrer le scanner</button>
      <button id="stopCamera" class="secondary hidden">■ Arrêter</button>
    </div>
    <div class="manual">
      <span>▥</span>
      <input id="manualInput" inputmode="numeric" maxlength="13" placeholder="Saisir manuellement EAN13">
      <button id="verifyBtn" class="verify">✓ Vérifier</button>
    </div>
    <div id="result" class="result" aria-live="polite"></div>
  </section>

  <section class="card history-card">
    <div class="history-head">
      <h2>◷ <span>Historique de scans</span></h2>
      <span id="count" class="count">0</span>
    </div>
    <div id="history" class="history"></div>
  </section>

  <button id="finishBtn" class="finish">🛡 <span>Fin du contrôle</span></button>
</main>
<script src="app.js"></script><script>
window.addEventListener("load",()=>{setTimeout(()=>document.getElementById("installHint").classList.remove("hidden"),1200)});
document.getElementById("closeInstallHint").onclick=()=>document.getElementById("installHint").remove();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
